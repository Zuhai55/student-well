<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudentWell GUI 1 - Laptop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF2F1;--bg-outer:#DCE5E4;--bezel:#0F1D27;--surface:#FFFFFF;--surface2:#F4F7F6;
  --ink:#14283B;--ink2:#51657A;--line:#D3DEDD;
  --brand:#1B4A66;--brand-bg:#16394F;--on-brand:#F2F8F8;
  --tide:#2A857D;--tide-l:#DCEEEB;
  --cta:#F4B93A;--cta-ink:#14283B;
  --hi:#BC3A2D;--hi-l:#F7E0DC;--mid:#9A5C08;--mid-l:#FAEBCB;--lo:#2A7D5E;--lo-l:#DAEEE5;
  --shadow:0 18px 50px rgba(10,30,45,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1923;--bg-outer:#091219;--bezel:#27404F;--surface:#142633;--surface2:#1A303F;
    --ink:#E6EEF1;--ink2:#9BB0BD;--line:#26414F;
    --brand:#8CCBE0;--brand-bg:#0F2A3B;--on-brand:#EAF4F6;
    --tide:#5CC2B8;--tide-l:#17383A;
    --hi:#FF8B7B;--hi-l:#3A1F1E;--mid:#F0B45A;--mid-l:#3A2E14;--lo:#6FD0A4;--lo-l:#143328;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1923;--bg-outer:#091219;--bezel:#27404F;--surface:#142633;--surface2:#1A303F;
  --ink:#E6EEF1;--ink2:#9BB0BD;--line:#26414F;
  --brand:#8CCBE0;--brand-bg:#0F2A3B;--on-brand:#EAF4F6;
  --tide:#5CC2B8;--tide-l:#17383A;
  --hi:#FF8B7B;--hi-l:#3A1F1E;--mid:#F0B45A;--mid-l:#3A2E14;--lo:#6FD0A4;--lo-l:#143328;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em;line-height:1.2;font-weight:700}
h1{font-size:28px}h2{font-size:19px}h3{font-size:15px;font-weight:600;font-family:'Public Sans',system-ui,sans-serif;letter-spacing:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tide);outline-offset:2px}
.ic{flex:none}
.sub{color:var(--ink2)}
.hint{color:var(--ink2);font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{height:100%}
.device{position:relative;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.shell[data-mode=mobile]{display:grid;place-items:center;padding:20px;background:var(--bg-outer)}
.shell[data-mode=mobile] .device{width:390px;height:844px;max-height:100%;border-radius:46px;border:10px solid var(--bezel);box-shadow:var(--shadow)}
@media (max-width:520px){
  .shell[data-mode=mobile]{padding:0;background:var(--bg)}
  .shell[data-mode=mobile] .device{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}
}

/* app frame */
.app{flex:1;min-height:0;display:flex}
.main{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:30px 40px 6px}
.top .sub{margin-top:4px}
.view{padding:14px 40px 48px;max-width:1180px}
.nav{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;padding:0 10px 22px;color:var(--brand)}
.navb{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--ink2);font-weight:500;min-height:44px}
.navb:hover{background:var(--surface2)}
.navb[aria-current=page]{background:var(--tide-l);color:var(--brand);font-weight:600}
.navsp{flex:1}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--surface);display:grid;place-items:center;font-weight:600;flex:none}
.userchip{display:flex;align-items:center;gap:10px;padding:12px 10px 0;border-top:1px solid var(--line);margin-top:8px;color:var(--ink2);font-size:13.5px}
.userchip b{display:block;color:var(--ink);font-size:14px}
.shell[data-mode=mobile] .app{flex-direction:column}
.shell[data-mode=mobile] .nav{order:2;width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px 10px;gap:0}
.shell[data-mode=mobile] .navb{flex:1;flex-direction:column;gap:3px;font-size:11.5px;padding:7px 0;min-height:52px;justify-content:center;border-radius:12px;text-align:center}
.shell[data-mode=mobile] .top{padding:26px 18px 4px}
.shell[data-mode=mobile] .view{padding:12px 18px 28px}
.shell[data-mode=mobile] h1{font-size:24px}
.shell[data-mode=mobile] .only-lap{display:none}
.shell[data-mode=laptop] .only-mob{display:none}

/* layout helpers */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.stack{display:grid;gap:18px}
.row{display:flex;align-items:center;gap:12px}
.row.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
@media (max-width:920px){.shell[data-mode=laptop] .grid2{grid-template-columns:1fr}.shell[data-mode=laptop] .nav{width:200px}.shell[data-mode=laptop] .top,.shell[data-mode=laptop] .view{padding-left:22px;padding-right:22px}}
.shell[data-mode=mobile] .grid2{grid-template-columns:1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.shell[data-mode=mobile] .card{padding:16px;border-radius:16px}
.card>h2{margin-bottom:12px}
.card.soft{background:var(--surface2)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;font-weight:600;border:1px solid transparent;text-align:center}
.btn.primary{background:var(--cta);color:var(--cta-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{border-color:var(--hi);color:var(--hi);background:transparent}
.btn.quiet{color:var(--brand);padding:8px 10px;min-height:40px}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px;border-radius:10px}
.btn.big{width:100%;min-height:52px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--surface);min-height:40px;font-size:14px}
.chip[aria-pressed=true]{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.shell[data-mode=mobile] .chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.shell[data-mode=mobile] .chips.scroll .chip{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.hi{background:var(--hi-l);color:var(--hi)}.pill.mid{background:var(--mid-l);color:var(--mid)}.pill.lo{background:var(--lo-l);color:var(--lo)}.pill.tide{background:var(--tide-l);color:var(--brand)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{padding:9px 18px;border-radius:9px;font-weight:600;color:var(--ink2);min-height:40px}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,30,45,.12)}
.shell[data-mode=mobile] .seg{display:flex}.shell[data-mode=mobile] .seg button{flex:1;text-align:center;padding:9px 6px}
.fld{display:grid;gap:6px;margin-top:14px}
.fld>span{font-weight:600;font-size:14px}
.fld input[type=text],.fld input[type=password],.fld input[type=date],.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:46px}
.fld textarea{resize:vertical}
.fld input[type=range]{width:100%;accent-color:var(--tide)}
.err{color:var(--hi);font-size:14px;margin-top:10px;font-weight:500}
.note.ok{color:var(--lo);font-weight:500;margin-top:12px;font-size:14px}
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;min-height:46px;border-radius:10px}
.chk .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink2);display:grid;place-items:center;flex:none;color:transparent}
.chk[aria-checked=true] .box{background:var(--tide);border-color:var(--tide);color:#fff}
.chk[aria-checked=true] .lbl{color:var(--ink2);text-decoration:line-through}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--tide)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px 12px 42px;min-height:48px}
.search .ic{position:absolute;left:14px;top:14px;color:var(--ink2)}
.bar{height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tide);border-radius:999px}

/* home */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);color:var(--ink2);font-size:13px;background:var(--surface)}
.mood:hover{background:var(--surface2)}
.mood[aria-pressed=true]{background:var(--tide-l);border-color:var(--tide);color:var(--brand);font-weight:600}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-family:'Bricolage Grotesque',sans-serif;font-size:48px;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px;margin-top:14px}
.week div{display:grid;gap:6px;justify-items:center;height:100%;align-content:end;font-size:12px;color:var(--ink2)}
.week i{display:block;width:100%;max-width:34px;background:var(--tide-l);border-radius:8px 8px 4px 4px}
.week .now i{background:var(--tide)}
.alert{display:flex;gap:14px;background:var(--mid-l);border-radius:16px;padding:16px}
.alert .ic{color:var(--mid);margin-top:2px}
.alert p{margin:2px 0 12px}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .grow{flex:1;min-width:0}
.item .ttl{font-weight:600}
.iconbub{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tide-l);color:var(--brand);flex:none}

/* support */
.split{display:grid;grid-template-columns:270px 1fr;gap:26px;align-items:start}
.shell[data-mode=mobile] .split{grid-template-columns:1fr;gap:12px}
@media (max-width:920px){.shell[data-mode=laptop] .split{grid-template-columns:1fr}}
.filters{display:grid;gap:16px}
.filters h3{margin-bottom:8px}
.svc{display:grid;gap:10px;margin-bottom:14px}
.svc .meta,.bk .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink2);font-size:14px}
.svc .meta span,.bk .meta span{display:inline-flex;align-items:center;gap:6px}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty .btn{margin-top:14px}
.bk .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bk.card{margin-bottom:14px}
.bk .more{margin-top:12px;padding:12px 14px;background:var(--surface2);border-radius:12px;font-size:14px;color:var(--ink2);display:grid;gap:4px}

/* for you */
.lvl{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-size:24px}
.sig{display:grid;gap:8px;margin-top:14px}
.sig li{list-style:none;display:flex;gap:10px;align-items:flex-start}
.sig{padding:0;margin-bottom:0}
.sig .ic{color:var(--mid);margin-top:2px}
.rec{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0;padding-top:4px}
.prog{display:grid;gap:10px;margin:18px 0 6px}
.prog div{display:flex;align-items:center;gap:10px;color:var(--ink2)}
.prog div.on{color:var(--ink);font-weight:600}
.prog i{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.prog div.on i{background:var(--tide)}

/* goals */
.goal{display:grid;gap:10px;margin-bottom:14px}
.habrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:8px 0}
.habrow:first-of-type{border-top:0}
.habrow .chk{flex:1;min-width:0}
.dots{display:flex;gap:4px;margin-top:2px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--tide)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--surface2)}

/* forecast */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:'Public Sans',sans-serif;fill:var(--ink2);font-size:11px}
.chart .band{cursor:pointer}
.period{margin-bottom:14px}
.period .head{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.peak{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:3px solid;flex:none;font-family:'Bricolage Grotesque',sans-serif}
.peak.hi{border-color:var(--hi);color:var(--hi)}.peak.mid{border-color:var(--mid);color:var(--mid)}.peak.lo{border-color:var(--lo);color:var(--lo)}
.period .body{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fac{display:block;width:100%;padding:10px 0;border-top:1px solid var(--line)}
.fac:first-of-type{border-top:0}
.fac .row{justify-content:space-between}
.fac p{color:var(--ink2);font-size:14px;margin-top:6px}
.okbox{display:flex;gap:12px;align-items:flex-start;background:var(--lo-l);color:var(--lo);padding:14px;border-radius:14px;font-weight:500;margin-top:12px}

/* settings */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow small{display:block;color:var(--ink2);font-size:13.5px}
.setcol{max-width:720px}

/* auth */
.auth{flex:1;min-height:0;display:flex;overflow:auto}
.hero{flex:1.1;background:var(--brand-bg);color:var(--on-brand);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-height:260px}
.hero .brand{color:var(--on-brand);padding:0}
.hero h1{font-size:44px;max-width:15ch;position:relative}
.hero p{max-width:40ch;opacity:.9;margin-top:14px;position:relative}
.hero svg.waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;pointer-events:none}
.authcard{flex:1;display:grid;place-content:center;padding:40px;gap:16px;max-width:560px;margin:0 auto;width:100%}
.authcard p.sub{max-width:38ch}
.shell[data-mode=mobile] .auth{flex-direction:column}
.shell[data-mode=mobile] .hero{flex:none;padding:30px 24px 26px;min-height:0}
.shell[data-mode=mobile] .hero h1{font-size:30px}
.shell[data-mode=mobile] .authcard{padding:24px;place-content:start;flex:1}
@media (max-width:820px){.shell[data-mode=laptop] .auth{flex-direction:column}.shell[data-mode=laptop] .hero{flex:none;padding:32px}.shell[data-mode=laptop] .hero h1{font-size:32px}}
.sso{margin:auto;width:min(440px,100%);padding:28px}
.shell[data-mode=mobile] .sso{padding:22px 18px}
.ssohead{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px;margin-bottom:16px}
.obwrap{margin:auto;width:min(620px,100%);padding:28px}
.shell[data-mode=mobile] .obwrap{padding:20px 18px;margin:0 auto}
.steps{display:flex;gap:6px;margin:6px 0 20px}
.steps i{height:6px;flex:1;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--tide)}
.obwrap h3{margin-top:20px;margin-bottom:8px}
.moods.sm{max-width:480px}

/* overlay */
#overlay{display:none}
#overlay.on{display:block;position:absolute;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(8,22,32,.5)}
.dialog{position:absolute;background:var(--surface);display:flex;flex-direction:column;max-height:calc(100% - 40px);outline:0;box-shadow:var(--shadow)}
.shell[data-mode=laptop] .dialog{left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));border-radius:20px}
.shell[data-mode=mobile] .dialog{left:0;right:0;bottom:0;border-radius:24px 24px 0 0;max-height:92%}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 8px}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none;margin:-6px -8px 0 0}
.x:hover{background:var(--surface2)}
.mb{padding:4px 22px 14px;overflow-y:auto}
.mb h3{margin:18px 0 8px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:12px 22px 20px;border-top:1px solid var(--line)}
.shell[data-mode=mobile] .mf .btn{flex:1}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;min-height:44px;background:var(--surface)}
.time[aria-pressed=true]{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.time[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.sumline{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.sumline:first-of-type{border-top:0}
.sumline span:first-child{color:var(--ink2)}
.bigok{width:64px;height:64px;border-radius:50%;background:var(--lo-l);color:var(--lo);display:grid;place-items:center;margin:6px auto 14px}
.center{text-align:center}
.breath{display:grid;justify-items:center;gap:14px;padding:14px 0 6px}
.orbwrap{width:230px;height:230px;position:relative;display:grid;place-items:center}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--tide-l),var(--tide));opacity:.9;transform:scale(.55)}
.orbtxt{position:relative;display:grid;justify-items:center;color:#0E2A35}
.orbtxt b{font-family:'Bricolage Grotesque',sans-serif;font-size:21px}
.orbtxt span{font-size:34px;font-weight:600;line-height:1.1}
.stepbig{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;line-height:1.35;padding:18px 0;min-height:130px}
.rate{display:grid;gap:10px;margin-top:14px}

/* toast */
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.shell[data-mode=laptop] #toast{bottom:32px}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){#toast,.sw::after{transition:none}}
</style>
</head>
<body>
<div class="shell" data-mode="laptop">
  <div class="device">
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script>
(function(){

function smooth(p){let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`}return d}
function tide(){
 const W=700,H=250,pl=34,pr=14,pt=14,pb=44,n=SERIES.length;
 const x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-(v-40)/50);
 const vals=SERIES.map((v,i)=>{let r=v;PERIODS.forEach(p=>{const k=(S.fc.accepted[p.id]||[]).length;if(k&&i>=p.from-1&&i<=p.to+1)r-=k*(i>=p.from&&i<=p.to?4:2)});return r});
 const pts=vals.map((v,i)=>[x(i),y(v)]);
 const line=smooth(pts),area=line+` L${x(n-1)},${H-pb} L${x(0)},${H-pb} Z`;
 const step=(W-pl-pr)/(n-1);
 const bands=PERIODS.map(p=>{const bx=x(p.from)-step/2,bw=(p.to-p.from)*step+step;const sel=S.fc.sel===p.id;const col=p.risk==='hi'?'var(--hi)':'var(--mid)';
  return `<g class="band" data-act="fc_sel" data-id="${p.id}" role="button" tabindex="0" aria-label="${RISKLBL[p.risk]} period ${p.label}"><rect x="${bx}" y="${pt}" width="${bw}" height="${H-pt-pb}" rx="8" fill="${col}" opacity="${sel?.22:.1}"/>${sel?`<rect x="${bx}" y="${pt}" width="${bw}" height="${H-pt-pb}" rx="8" fill="none" stroke="${col}" stroke-width="1.5"/>`:''}</g>`}).join('');
 const grid=[50,60,75,90].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===75?'5 4':'0'}" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
 const xl=SERIES.map((v,i)=>`<text x="${x(i)}" y="${H-pb+16}" text-anchor="middle">${DAYN[i]}</text><text x="${x(i)}" y="${H-pb+30}" text-anchor="middle" ${i===0?'style="font-weight:600;fill:var(--ink)"':''}>${DATEN[i]}</text>`).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted stress score for the next 14 days. High points on 14 to 15 October and 21 to 22 October.">
  <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--tide)" stop-opacity=".35"/><stop offset="1" stop-color="var(--tide)" stop-opacity="0"/></linearGradient></defs>
  ${grid}${bands}<path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--tide)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="5.5" fill="var(--tide)" stroke="var(--surface)" stroke-width="2"/><text x="${pts[0][0]+10}" y="${pts[0][1]-10}" style="font-weight:600;fill:var(--ink)">Today</text>${xl}</svg>`;
}
function periodCard(p){
 const sel=S.fc.sel===p.id,acc=S.fc.accepted[p.id],pk=peakOf(p),rk=acc?riskOf(pk):p.risk;
 let body='';
 if(sel){
  const picks=S.fc.picks[p.id];
  body=`<div class="body"><h3>What is driving this</h3><div role="list">${p.factors.map((f,i)=>{const o=S.fc.factor===p.id+i;return `<button class="fac" role="listitem" data-act="fc_factor" data-k="${p.id}${i}" aria-expanded="${o}"><span class="row"><span>${esc(f[0])}</span><span class="row" style="gap:6px"><span class="pill ${WEIGHT[f[1]]}">${f[1]}</span>${ic(o?'up':'down',16)}</span></span>${o?`<p>${esc(f[2])}</p>`:''}</button>`}).join('')}</div>

  ${acc?`<div class="okbox">${ic('check',22)}<span>${acc.length} ${acc.length===1?'change':'changes'} added to your calendar. Projected peak is now ${pk}.</span></div><div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="fc_undo" data-id="${p.id}">Undo changes</button></div>`

}
function mGoal(m){
 return mhead('New goal')+`<div class="mb"><label class="fld" style="margin-top:0"><span>What do you want to achieve?</span><input type="text" value="${esc(m.name)}" data-scope="modal" data-in="name" placeholder="For example, Walk to campus twice a week"></label>
 <h3>Category</h3>${chips2([['Academic','Academic'],['Physical','Physical'],['Mind','Mind'],['Sleep','Sleep'],['Other','Other']],m.cat,'goal_cat')}
 <label class="fld"><span>Target date</span><input type="date" value="${esc(m.due)}" data-scope="modal" data-in="due"></label>
 <button class="chk" role="checkbox" aria-checked="${m.addHab}" data-act="goal_hab" style="margin-top:10px"><span class="box">${ic('check',16)}</span><span class="lbl" style="text-decoration:none!important;color:var(--ink)">Add a daily habit to support this goal</span></button>
 ${m.addHab?`<label class="fld" style="margin-top:0"><span>Habit name</span><input type="text" value="${esc(m.habName)}" data-scope="modal" data-in="habName" placeholder="For example, 20 minute walk"></label>`:''}
 ${m.err?`<p class="err" role="alert">${esc(m.err)}</p>`:''}</div><div class="mf"><button class="btn ghost" data-act="m_close">Cancel</button><button class="btn primary" data-act="goal_save">Save goal</button></div>`;
}
function mHab(m){
 return mhead(m.id?'Edit habit':'New habit')+`<div class="mb"><label class="fld" style="margin-top:0"><span>Habit name</span><input type="text" value="${esc(m.name)}" data-scope="modal" data-in="name"></label>
 <h3>How often</h3>${chips2([['Daily','Daily'],['Weekdays','Weekdays'],['3 times a week','3 times a week']],m.freq,'hab_freq')}
 <h3>Time of day</h3>${chips2([['Morning','Morning'],['Afternoon','Afternoon'],['Evening','Evening']],m.time,'hab_time')}
 <div class="setrow" style="margin-top:8px"><div><b>Remind me</b><small>Sent at a quiet moment in your calendar</small></div><button class="sw" role="switch" aria-checked="${m.remind}" aria-label="Remind me" data-act="hab_remind"></button></div>
 ${m.err?`<p class="err" role="alert">${esc(m.err)}</p>`:''}</div>
 <div class="mf" style="justify-content:space-between">${m.id?`<button class="btn danger" data-act="hab_archive">${ic('archive',16)} Archive</button>`:'<span></span>'}<span class="row"><button class="btn ghost" data-act="m_close">Cancel</button><button class="btn primary" data-act="hab_save">Save changes</button></span></div>`;
}
function modalHtml(){const m=S.modal;return {book:mBook,cancel:mCancel,ext:mExt,act:mAct,goal:mGoal,hab:mHab}[m.type](m)}

/* ---------- render ---------- */
let lastKey='';
function R(){
 const root=$('#app');const main=root.querySelector('.main');
 const keep=main&&lastKey===S.screen+S.tab?main.scrollTop:0;
 root.innerHTML=viewRoot();lastKey=S.screen+S.tab;
 const m2=root.querySelector('.main');if(m2&&keep)m2.scrollTop=keep;
 const au=root.querySelector('.auth');if(au&&!keep)au.scrollTop=0;
}
let lastFocus=null;
function M(open){
 const o=$('#overlay');
 if(!S.modal){o.className='';o.innerHTML='';if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus();return}
 if(open)lastFocus=document.activeElement;
 o.className='on';
 o.innerHTML=`<div class="scrim" data-act="m_close"></div><div class="dialog" role="dialog" aria-modal="true" aria-label="Dialog" tabindex="-1">${modalHtml()}</div>`;
 if(open){const d=o.querySelector('.dialog');if(d)d.focus()}
}
function openModal(m){S.modal=m;M(true)}
function closeModal(){stopAct();S.modal=null;M(false)}

/* ---------- breathing / activity ---------- */
let actTimer=null;
const PH={in:{t:4,label:'Breathe in',scale:1},hold:{t:7,label:'Hold',scale:1},out:{t:8,label:'Breathe out',scale:.55}};
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopAct(){if(actTimer){clearInterval(actTimer);actTimer=null}}
function breathVisual(){
 const m=S.modal;if(!m||m.type!=='act')return;
 const orb=$('#orb'),lab=$('#phaseLabel'),cnt=$('#phaseCount'),cyc=$('#cycleLbl');if(!orb)return;
 const p=PH[m.bphase];lab.textContent=p.label;cnt.textContent=m.count;cyc.textContent='Round '+m.cycle+' of 4';
}
function setScale(){const m=S.modal,orb=$('#orb');if(!orb||!m)return;const p=PH[m.bphase];orb.style.transitionProperty='transform';orb.style.transitionTimingFunction='ease-in-out';orb.style.transitionDuration=(reduce||m.bphase==='hold')?'0s':p.t+'s';orb.style.transform='scale('+p.scale+')'}
function breathStart(){
 const m=S.modal;m.bphase='in';m.count=PH.in.t;m.cycle=1;m.paused=false;
 breathVisual();requestAnimationFrame(()=>requestAnimationFrame(setScale));
 stopAct();actTimer=setInterval(()=>{
  const m=S.modal;if(!m||m.type!=='act'||m.paused)return;
  m.count--;
  if(m.count<=0){
   if(m.bphase==='in')m.bphase='hold';else if(m.bphase==='hold')m.bphase='out';
   else{if(m.cycle>=4){actFinish();return}m.cycle++;m.bphase='in'}
   m.count=PH[m.bphase].t;setScale();
  }
  breathVisual();
 },1000);
}
function actFinish(){stopAct();if(S.modal&&S.modal.type==='act'){S.modal.phase='done';M(false)}}

/* ---------- actions ---------- */
function act(a,t){
 const v=t.dataset.v,id=t.dataset.id,i=t.dataset.i!=null?+t.dataset.i:null;
 switch(a){
 case 'login':S.screen='sso';R();break;
 case 'sso_cancel':S.screen='login';R();break;
 case 'sso_submit':{
  if(!S.sso.upi.trim()||!S.sso.pw){S.sso.err='Enter your UPI and password to continue.';R();break}
  S.sso.err='';S.sso.busy=true;R();
  setTimeout(()=>{S.sso.busy=false;S.screen=S.onboarded?'app':'onb1';S.tab='home';R()},900);break}
 case 'ob_mood':S.ob.mood=i;S.ob.err='';R();break;
 case 'ob_stress':S.ob.stress=v;S.ob.err='';R();break;
 case 'ob_stressor':toggleIn(S.ob.stressors,v);R();break;
 case 'ob_help':toggleIn(S.ob.help,v);R();break;
 case 'ob_rem':S.ob.reminder=v;R();break;
 case 'ob_chan':S.ob.channel=v;R();break;
 case 'ob_next':if(S.ob.mood==null||!S.ob.stress){S.ob.err='Choose how you feel today and how stressed you have been to continue.';R();break}S.ob.err='';S.screen='onb2';R();break;
 case 'ob_back':S.screen='onb1';R();break;
 case 'ob_finish':S.onboarded=true;S.screen='app';S.tab='home';if(S.ob.mood!=null)S.checkin=null;R();toast('You are all set, '+S.user.name);break;
 case 'tab':S.tab=v;R();break;
 case 'mood':S.checkin={mood:i};R();toast('Check-in saved');break;
 case 'hab_toggle':{const h=HAB(id);h.done=!h.done;h.streak+=h.done?1:-1;const g=S.goals.find(x=>x.id===h.goalId);if(g)g.pct=Math.max(0,Math.min(100,g.pct+(h.done?2:-2)));R();if(h.done)toast('Logged. '+h.streak+'-day streak');break}
 case 'sup_view':S.sup.view=v;R();break;
 case 'sup_topic':S.sup.topic=v;R();break;
 case 'sup_avail':S.sup.avail=v;R();break;
 case 'sup_urg':S.sup.urg=v;R();break;
 case 'sup_clear':S.sup.q='';S.sup.topic='all';S.sup.avail='any';S.sup.urg='any';R();break;
 case 'svc_book':{const s=SVC(id);openModal({type:'book',svcId:id,step:1,day:null,time:null,format:s.fmt==='In person'?'In person':'Video call',note:'',err:'',bookingId:null});break}
 case 'svc_ext':openModal({type:'ext'});break;
 case 'bk_details':S.sup.open=S.sup.open===id?null:id;R();break;
 case 'bk_resched':{const b=S.bookings.find(x=>x.id===id);openModal({type:'book',svcId:b.svcId,step:1,day:null,time:null,format:b.format,note:b.note,err:'',bookingId:id});break}
 case 'bk_cancel':openModal({type:'cancel',id:id});break;
 case 'm_cancel_yes':{S.bookings=S.bookings.filter(x=>x.id!==S.modal.id);closeModal();R();toast('Booking cancelled');break}
 case 'm_day':{const m=S.modal;m.day=v;const s=SVC(m.svcId),di=daysFor(s).indexOf(v);const ti=TIMES.indexOf(m.time);if(ti>-1&&taken(di,ti))m.time=null;m.err='';M(false);break}
 case 'm_time':S.modal.time=v;S.modal.err='';M(false);break;
 case 'm_format':S.modal.format=v;M(false);break;
 case 'm_confirm':{const m=S.modal;if(!m.day||!m.time){m.err='Pick a day and a time to continue.';M(false);break}
  const s=SVC(m.svcId);
  if(m.bookingId){const b=S.bookings.find(x=>x.id===m.bookingId);b.day=m.day;b.time=m.time;b.format=m.format;b.note=m.note}
  else S.bookings.push({id:'b'+(++seq),svcId:s.id,name:s.name,org:s.org,day:m.day,time:m.time,format:m.format,note:m.note});
  m.step=2;M(false);R();break}
 case 'm_cal':toast('Added to your calendar');break;
 case 'm_mine':S.sup.view='mine';S.tab='support';closeModal();R();break;
 case 'm_close':closeModal();break;
 case 'ins_req':{S.ins={status:'loading',step:0};R();
  const tm=setInterval(()=>{if(S.ins.status!=='loading'){clearInterval(tm);return}S.ins.step++;if(S.ins.step>2){S.ins.status='done';clearInterval(tm)}if(S.tab==='foryou')R()},750);break}
 case 'plan_toggle':{const k=v;toggleIn(S.plan,k);R();toast(S.plan.indexOf(k)>-1?'Added to your plan':'Removed from your plan');break}
 case 'act_open':openModal({type:'act',id:v,phase:'intro',step:0});break;
 case 'act_begin':{const a=ACTS[S.modal.id];S.modal.phase='run';S.modal.step=0;M(false);if(a.kind==='breath')breathStart();break}
 case 'act_pause':{const m=S.modal;m.paused=!m.paused;$('#pauseBtn').textContent=m.paused?'Resume':'Pause';const orb=$('#orb');if(m.paused){const cs=getComputedStyle(orb).transform;orb.style.transitionDuration='0s';orb.style.transform=cs}else setScale();break}
 case 'act_skip':actFinish();break;
 case 'act_next':{const a=ACTS[S.modal.id];if(S.modal.step>=a.steps.length-1){S.modal.phase='done'}else S.modal.step++;M(false);break}
 case 'act_back':S.modal.step=Math.max(0,S.modal.step-1);M(false);break;
 case 'act_rate':S.modal.phase='rated';M(false);break;
 case 'act_done':{const k=S.modal.id;if(S.done.indexOf(k)<0)S.done.push(k);closeModal();R();toast('Activity logged');break}
 case 'gl_view':S.gl.view=v;R();break;
 case 'gl_arch':S.gl.showArchived=!S.gl.showArchived;R();break;
 case 'goal_new':openModal({type:'goal',name:'',cat:'Academic',due:'2026-12-28',addHab:false,habName:'',err:''});break;
 case 'goal_cat':S.modal.cat=v;M(false);break;
 case 'goal_hab':S.modal.addHab=!S.modal.addHab;M(false);break;
 case 'goal_save':{const m=S.modal;if(!m.name.trim()){m.err='Give your goal a name to save it.';M(false);break}
  const gid='g'+(++seq);S.goals.unshift({id:gid,name:m.name.trim(),cat:m.cat,pct:0,due:m.due?fmtDate(m.due):'Ongoing'});
  if(m.addHab&&m.habName.trim())S.habits.push({id:'h'+(++seq),name:m.habName.trim(),freq:'Daily',time:'Morning',streak:0,done:false,week:[0,0,0,0,0,0],goalId:gid,archived:false,remind:true});
  closeModal();S.gl.view='goals';R();toast('Goal added');break}
 case 'hab_new':openModal({type:'hab',id:null,name:'',freq:'Daily',time:'Morning',remind:true,err:''});break;
 case 'hab_edit':{const h=HAB(id);openModal({type:'hab',id:id,name:h.name,freq:h.freq,time:h.time,remind:h.remind,err:''});break}
 case 'hab_freq':S.modal.freq=v;M(false);break;
 case 'hab_time':S.modal.time=v;M(false);break;
 case 'hab_remind':S.modal.remind=!S.modal.remind;M(false);break;
 case 'hab_save':{const m=S.modal;if(!m.name.trim()){m.err='Give your habit a name to save it.';M(false);break}
  if(m.id){const h=HAB(m.id);h.name=m.name.trim();h.freq=m.freq;h.time=m.time;h.remind=m.remind}
  else S.habits.push({id:'h'+(++seq),name:m.name.trim(),freq:m.freq,time:m.time,streak:0,done:false,week:[0,0,0,0,0,0],goalId:null,archived:false,remind:m.remind});
  closeModal();R();toast('Habit saved');break}
 case 'hab_archive':{HAB(S.modal.id).archived=true;closeModal();S.gl.view='habits';R();toast('Habit archived');break}
 case 'hab_restore':HAB(id).archived=false;R();toast('Habit restored');break;
 case 'fc_sel':S.fc.sel=S.fc.sel===id&&t.closest('.period')?null:id;S.fc.factor=null;R();break;
 case 'fc_factor':S.fc.factor=S.fc.factor===t.dataset.k?null:t.dataset.k;R();break;
 case 'fc_pick':{const arr=S.fc.picks[id];toggleIn(arr,i);R();break}
 case 'fc_accept':{const picks=S.fc.picks[id];if(!picks.length){toast('Choose at least one change first');break}S.fc.accepted[id]=picks.slice();R();toast('Changes added to your calendar');break}
 case 'fc_undo':delete S.fc.accepted[id];R();toast('Changes removed');break;
 case 'set_sw':S.set[t.dataset.k]=!S.set[t.dataset.k];R();break;
 case 'set_time':S.set.time=v;R();break;
 case 'set_save':{S.user.name=(S.set.name||'').trim()||S.user.name;S.set.name=S.user.name;R();toast('Settings saved');break}
 case 'signout':S.screen='login';S.tab='home';S.modal=null;M(false);R();break;
 }
}
function toggleIn(arr,v){const k=arr.indexOf(v);if(k>-1)arr.splice(k,1);else arr.push(v)}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.classList.contains('scrim')&&e.target!==t)return;
 act(t.dataset.act,t);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.modal){closeModal();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-act]')){e.preventDefault();act(e.target.dataset.act,e.target)}
 if(e.key==='Enter'&&e.target.matches&&e.target.matches('input[data-scope="sso"]')){act('sso_submit',e.target)}
});
document.addEventListener('input',e=>{
 const t=e.target,sc=t.dataset&&t.dataset.scope;if(!sc)return;
 const k=t.dataset.in,obj={sso:S.sso,modal:S.modal,sup:S.sup,set:S.set,ob:S.ob}[sc];if(!obj)return;
 obj[k]=t.type==='range'?parseFloat(t.value):t.value;
 if(sc==='sup'&&k==='q'){$('#svcList').innerHTML=svcList();$('#svcCount').textContent=filtered().length+' services'}
 if(sc==='ob'&&k==='sleep'){$('#sleepVal').textContent=obj.sleep+' hours'}
});
R();
})();
</script>
</body>
</html>
